version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    ignore:
      # Aiogram 3.31 declares pydantic<2.14; review when Aiogram is upgraded.
      - dependency-name: pydantic
        versions: [">=2.14"]
      # Pydantic pins one exact core version; change it only with its parent.
      - dependency-name: pydantic-core
        versions: [">=0"]
      # aiohttp 3.14 (required by Aiogram) declares multidict<7.
      - dependency-name: multidict
        versions: [">=7"]
      # SymPy 1.14 declares mpmath<1.4; review when SymPy is upgraded.
      - dependency-name: mpmath
        versions: [">=1.4"]
      # PyPI updates discard +cpu and pull CUDA. Upgrade the official CPU build manually.
      - dependency-name: torch
        versions: [">=0"]
    groups:
      neural-runtime:
        patterns: [transformers, tokenizers, huggingface-hub, sympy, filelock, fsspec, onnxruntime, piper-tts]
      minor-and-patch:
        update-types: [minor, patch]
  # Admin panel: exact pins in package-lock.json; CI builds it and runs Playwright with axe-core.
  - package-ecosystem: npm
    directory: /admin-ui
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    groups:
      panel-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: monthly}
