name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -c constraints-linux.txt -r requirements.txt ruff mypy
      - run: ruff check .
      - run: mypy
      - name: Shell syntax
        run: find . -path ./admin-ui/node_modules -prune -o -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - run: python -m compileall -q app tests scripts

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit
      - name: Audit pinned runtime and neural dependencies
        run: |
          # Advisory databases identify the CPU wheel by its upstream torch version.
          sed 's/+cpu$//' constraints-neural-linux.txt > /tmp/neural-audit.txt
          pip-audit --no-deps --disable-pip --strict -r constraints-linux.txt -r /tmp/neural-audit.txt

  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json
      - run: npm ci --prefix admin-ui
      - run: npm audit --prefix admin-ui --audit-level=moderate
      - run: npm run build --prefix admin-ui

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: biblebot_ci
          POSTGRES_USER: biblebot_ci
          POSTGRES_PASSWORD: ci-only-not-a-production-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biblebot_ci -d biblebot_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      RUN_DB_TESTS: '1'
      DATABASE_URL: postgresql://biblebot_ci:ci-only-not-a-production-secret@localhost:5432/biblebot_ci
      PYTHONUTF8: '1'
      AUDIO_MODELS_PATH: /tmp/biblebot-neural-voices
      RUN_NEURAL_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install 'torch==2.13.0+cpu' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-neural.txt
      - run: python -m pip install -c constraints-linux.txt -r requirements.txt -r requirements-test.txt
      - run: python -m pip check
      - name: Local speech runtime
        run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg tesseract-ocr tesseract-ocr-rus
      - uses: actions/cache@v4
        with:
          path: ${{ env.AUDIO_MODELS_PATH }}
          key: neural-voices-${{ hashFiles('app/data/speech-models.json', 'app/data/russian-voice.json') }}
      - run: python -m app.neural_audio_admin prepare
      - run: python -m pip install 'pytest-cov>=5,<8'
      - run: python -m pytest -o addopts= -q --junitxml=test-results.xml --cov=app --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results.xml
            coverage.xml

  image:
    needs: [lint, test, audit, panel]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: biblebot_image_ci
          POSTGRES_USER: biblebot_image_ci
          POSTGRES_PASSWORD: image-ci-only-not-a-production-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biblebot_image_ci -d biblebot_image_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://biblebot_image_ci:image-ci-only-not-a-production-secret@127.0.0.1:5432/biblebot_image_ci
      BIBLE_PROFILE: none
      ADMIN_API_KEY: image-ci-only-key-with-at-least-32-characters
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate every Compose profile
        run: |
          cp .env.example .env
          docker compose --profile '*' config --quiet
      - name: Build (and scan) image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: bible-messenger-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container database and admin smoke test
        run: |
          docker run --rm --network host -e DATABASE_URL -e BIBLE_PROFILE bible-messenger-bot:ci python -m app.cli seed --profile none
          docker run -d --name biblebot-ci-admin --network host -e DATABASE_URL -e BIBLE_PROFILE -e ADMIN_API_KEY bible-messenger-bot:ci uvicorn app.web.main:app --host 127.0.0.1 --port 18080
          trap 'docker logs biblebot-ci-admin; docker rm -f biblebot-ci-admin' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/ready >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/ready
          curl -fsS http://127.0.0.1:18080/panel/ >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/admin/net)" = 401
          curl -fsS -H "X-Admin-Key: $ADMIN_API_KEY" http://127.0.0.1:18080/api/admin/net >/dev/null
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bible-messenger-bot:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}"
          docker tag bible-messenger-bot:ci "$tag"
          docker tag bible-messenger-bot:ci "ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          docker push "$tag"
          docker push "ghcr.io/${GITHUB_REPOSITORY,,}:latest"
