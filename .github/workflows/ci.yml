name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: biblebot_ci
          POSTGRES_USER: biblebot_ci
          POSTGRES_PASSWORD: ci-only-not-a-production-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biblebot_ci -d biblebot_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      RUN_DB_TESTS: '1'
      DATABASE_URL: postgresql://biblebot_ci:ci-only-not-a-production-secret@localhost:5432/biblebot_ci
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -c constraints-linux.txt -r requirements.txt -r requirements-test.txt
      - run: python -m pip check
      - run: python -m compileall -q app tests scripts
      - name: Shell syntax
        run: for f in *.sh; do bash -n "$f"; done
      - run: python -m pytest -o addopts= -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
