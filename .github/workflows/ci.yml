name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -c constraints-linux.txt -r requirements.txt ruff mypy
      - run: ruff check .
      - run: mypy
      - name: Shell syntax
        run: for f in *.sh; do bash -n "$f"; done
      - run: python -m compileall -q app tests scripts

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit
      - run: pip-audit -r requirements.txt --disable-pip
        continue-on-error: ${{ github.event_name == 'pull_request' }}

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: biblebot_ci
          POSTGRES_USER: biblebot_ci
          POSTGRES_PASSWORD: ci-only-not-a-production-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biblebot_ci -d biblebot_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      RUN_DB_TESTS: '1'
      DATABASE_URL: postgresql://biblebot_ci:ci-only-not-a-production-secret@localhost:5432/biblebot_ci
      PYTHONUTF8: '1'
      AUDIO_MODELS_PATH: /tmp/biblebot-neural-voices
      RUN_NEURAL_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install 'torch==2.10.0+cpu' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-neural.txt
      - run: python -m pip install -c constraints-linux.txt -r requirements.txt -r requirements-test.txt
      - run: python -m pip check
      - name: Local speech runtime
        run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg tesseract-ocr tesseract-ocr-rus
      - uses: actions/cache@v4
        with:
          path: ${{ env.AUDIO_MODELS_PATH }}
          key: neural-voices-${{ hashFiles('app/data/speech-models.json', 'app/data/russian-voice.json') }}
      - run: python -m app.neural_audio_admin prepare
      - run: python -m pip install 'pytest-cov>=5,<8'
      - run: python -m pytest -o addopts= -q --junitxml=test-results.xml --cov=app --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results.xml
            coverage.xml

  image:
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (and scan) image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: bible-messenger-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: bible-messenger-bot:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}"
          docker tag bible-messenger-bot:ci "$tag"
          docker tag bible-messenger-bot:ci "ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          docker push "$tag"
          docker push "ghcr.io/${GITHUB_REPOSITORY,,}:latest"
