[project]
name = "bible-messenger-bot"
version = "1.20.0"
description = "Multilingual Telegram and MAX Bible reading and scheduled publishing bot"
requires-python = ">=3.12"
license = {text = "MIT"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["cache", "backups"]

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "SIM"]
# The codebase uses a deliberately dense one-line style; formatting rules are not enforced.
ignore = ["E501", "E701", "E702", "E402", "E741", "SIM117", "SIM102", "SIM105"]
