# Prometheus для BibleMessengerBot. Метрики отдаёт панель: GET /metrics (HTTP Basic: admin / ADMIN_API_KEY).
global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: biblebot
    metrics_path: /metrics
    basic_auth:
      username: admin
      password_file: /tmp/admin_password        # создаётся при запуске из ADMIN_API_KEY (см. docker-compose, профиль monitoring)
    static_configs:
      - targets: ['admin:8080']
