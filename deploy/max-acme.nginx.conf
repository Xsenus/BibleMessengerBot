# Dedicated HTTP-01 receiver; no bot, operations panel, or private files here.
worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    access_log off;
    server {
        listen 80;
        server_name _;
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
            try_files $uri =404;
        }
        location = /max-edge-health { default_type text/plain; return 200 'ready\n'; }
        location / { return 404; }
    }
}
