name: bible-messenger-bot
x-app: &app
  image: bible-messenger-bot:1.17.0
  build:
    context: .
    dockerfile: Dockerfile
  env_file: .env
  restart: unless-stopped
  stop_grace_period: 45s
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  networks: [internal]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-ready: &ready
  postgres:
    condition: service_healthy
  bootstrap:
    condition: service_completed_successfully

services:
  prayer-ai-bootstrap:
    <<: *app
    profiles: [prayers]
    mem_limit: 256m
    cpus: 0.5
    restart: "no"
    volumes: [prayer_models:/app/cache/prayer-ai]
    command: [python, -m, app.prayer_ai_admin]

  prayer-ai:
    image: ghcr.io/ggml-org/llama.cpp@sha256:33868c035b21dc63f7c60b7438774283fd99215bc319114eb03de5df4ce7cd6b
    profiles: [prayers]
    restart: unless-stopped
    mem_limit: 1280m
    cpus: 1.0
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [internal]
    volumes: [prayer_models:/models:ro]
    command: ["-m", /models/Qwen3-0.6B-Q8_0.gguf, "--host", "0.0.0.0", "--port", "8080", "-c", "2048", "-t", "2", "-b", "128", "-ub", "64", "-n", "128", "--parallel", "1", "--alias", local-prayer, "--no-webui"]
    depends_on:
      prayer-ai-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8080/health]
      start_period: 90s
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  composer:
    <<: *app
    mem_limit: 256m
    cpus: 0.5
    command: [python, -m, app.worker.composer]
    depends_on: *ready
    healthcheck:
      test: [CMD, python, -m, app.healthcheck, composer]
      start_period: 45s
      interval: 30s
      timeout: 10s
      retries: 3

  speaker:
    <<: *app
    mem_limit: 1536m
    cpus: 1.0
    volumes: [source_cache:/app/cache]
    command: [python, -m, app.worker.speaker]
    depends_on: *ready
    healthcheck:
      test: [CMD, python, -m, app.healthcheck, speaker]
      start_period: 90s
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16-alpine
    mem_limit: 1g
    cpus: 1.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-biblebot}
      POSTGRES_USER: ${POSTGRES_USER:-biblebot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [internal]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  bootstrap:
    <<: *app
    mem_limit: 1g
    cpus: 1.5
    restart: "no"
    command: [python, -m, app.bootstrap]
    depends_on:
      postgres:
        condition: service_healthy
    volumes: [source_cache:/app/cache]

  bot:
    <<: *app
    mem_limit: 512m
    cpus: 0.75
    command: [python, -m, app.bot.main]
    depends_on: *ready
    healthcheck:
      test: [CMD, python, -m, app.healthcheck, bot]
      start_period: 90s
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    <<: *app
    mem_limit: 512m
    cpus: 0.75
    command: [python, -m, app.worker.main]
    depends_on: *ready
    healthcheck:
      test: [CMD, python, -m, app.healthcheck, worker]
      start_period: 60s
      interval: 30s
      timeout: 10s
      retries: 3

  admin:
    <<: *app
    mem_limit: 256m
    cpus: 0.5
    command: [uvicorn, app.web.main:app, --host, 0.0.0.0, --port, '8080', --no-proxy-headers]
    depends_on: *ready
    ports: ['127.0.0.1:${ADMIN_HOST_PORT:-8080}:8080']
    healthcheck:
      test: [CMD, curl, -fsS, 'http://127.0.0.1:8080/ready']
      start_period: 30s
      interval: 15s
      timeout: 10s
      retries: 10

  illustrator:
    <<: *app
    mem_limit: 384m
    cpus: 0.5
    command: [python, -m, app.worker.illustrator]
    depends_on: *ready
    healthcheck:
      test: [CMD, python, -m, app.healthcheck, illustrator]
      start_period: 60s
      interval: 30s
      timeout: 10s
      retries: 3

  backup:
    <<: *app
    profiles: [maintenance]
    user: '0:0'
    mem_limit: 256m
    cpus: 0.5
    restart: 'no'
    command: [python, -m, app.backup_admin, status]
    volumes: ['./backups:/app/backups']

volumes:
  prayer_models:
  postgres_data:
  source_cache:
networks:
  internal:
    driver: bridge
